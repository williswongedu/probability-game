<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數源對決 - 概率防禦戰</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: radial-gradient(circle, #0d1124 0%, #030511 100%);
            color: #d1dbff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #4d7cff;
            margin: 0;
            text-shadow: 0 0 12px rgba(77, 124, 255, 0.6);
            font-size: 28px;
        }

        .battle-container {
            display: flex;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* 左側：戰場與防線 */
        .battle-left {
            flex: 1.2;
            min-width: 340px;
            background: rgba(8, 12, 36, 0.9);
            border: 3px solid #4d7cff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 0 25px rgba(77,124,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 右側：英靈高斯卡牌 */
        .battle-right {
            flex: 0.8;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* 戰場投影區 (Battlefield Arena) */
        .arena {
            width: 100%;
            height: 180px;
            background: linear-gradient(to bottom, rgba(13, 20, 56, 0.8), rgba(5, 7, 23, 0.9));
            border: 2px solid #233470;
            border-radius: 10px;
            position: relative;
            margin-bottom: 20px;
            overflow: hidden;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* 混沌魔獸 Boss UI */
        .boss-box {
            text-align: center;
            transition: transform 0.2s;
        }

        .boss-avatar {
            font-size: 70px;
            animation: boss-bounce 2s infinite ease-in-out;
        }

        @keyframes boss-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-12px) scale(1.05); }
        }

        /* HP 血條 */
        .hp-bar-container {
            width: 120px;
            height: 10px;
            background: #222;
            border: 1px solid #ff4d4d;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }

        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff4d4d, #ff9e9e);
            transition: width 0.4s ease;
        }

        /* 玩家防守核心 */
        .core-avatar {
            font-size: 60px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
        }

        /* 戰術決策題目 */
        .tactics-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #233470;
            border-radius: 10px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .tactics-title {
            color: #6da2ff;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .tactics-desc {
            font-size: 15px;
            line-height: 1.5;
        }

        /* 魔法卡牌對比面版 */
        .spell-compare {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-bottom: 15px;
        }

        .spell-card {
            flex: 1;
            background: rgba(13, 27, 72, 0.6);
            border: 1.5px solid #3c5fa6;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }

        .spell-card strong {
            color: #00ffff;
            display: block;
            margin-bottom: 4px;
        }

        /* 輸入與提交 */
        .control-panel {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .control-panel input {
            flex: 1;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #233470;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            text-align: center;
        }

        .btn-fire {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4d7cff 0%, #1a3fa3 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(77,124,255,0.4);
        }

        #battleFeedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 15px;
            min-height: 22px;
            text-align: center;
        }

        /* 雷鳴精算師高斯閃卡 */
        .gauss-card {
            width: 200px;
            background: #06091c;
            border: 3px solid #4d7cff;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 0 15px rgba(77,124,255,0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .gauss-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(77,124,255,0.6);
        }

        .gauss-avatar-box {
            height: 110px;
            background: radial-gradient(circle, #254096, #070d24);
            border-radius: 6px;
            margin: 8px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        .skill-btn {
            background: #1e367a;
            border: 1px solid #4d7cff;
            color: #9ec5ff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .tooltip-box {
            background: rgba(7, 12, 38, 0.95);
            border: 2px solid #4d7cff;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #9ec5ff;
            width: 200px;
            display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="game-header">
    <h1>🛡️ 概率防禦戰</h1>
    <p>—— 精算魔法「期望值 (Expected Value)」擊退魔獸 ——</p>
</div>

<div class="battle-container">
    <!-- 左側：戰場及題目 -->
    <div class="battle-left">
        <!-- 戰場投影 -->
        <div class="arena">
            <div class="core-box">
                <div class="core-avatar">🛡️</div>
                <div style="font-size: 11px; text-align: center; color: #00ffff;">防守核心</div>
            </div>
            
            <div style="color: #ff4d4d; font-weight: bold; font-size: 20px;">VS</div>

            <div class="boss-box" id="bossContainer">
                <div class="boss-avatar" id="bossIcon">👹</div>
                <div style="font-size: 12px; color: #ff9e9e;" id="bossName">混沌獸 · 負期望值</div>
                <div class="hp-bar-container">
                    <div class="hp-bar-fill" id="hpFill"></div>
                </div>
            </div>
        </div>

        <!-- 戰術決策題目 -->
        <div class="tactics-box">
            <div class="tactics-title" id="tacticLevel">LEVEL 1 ✦ 期望值對決</div>
            <div class="tactics-desc" id="tacticText">加載戰術指令中...</div>
        </div>

        <!-- 魔法陣屬性對比 -->
        <div class="spell-compare">
            <div class="spell-card">
                <strong>陣型【Alpha】</strong>
                <span id="spellAlphaDesc">載入中...</span>
            </div>
            <div class="spell-card">
                <strong>陣型【Beta】</strong>
                <span id="spellBetaDesc">載入中...</span>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="control-panel">
            <input type="number" id="evInput" placeholder="請輸入最優陣型的期望傷害">
            <button class="btn-fire" onclick="fireSpells()">精算發射</button>
        </div>

        <div id="battleFeedback"></div>
    </div>

    <!-- 右側：5星神卡 高斯 -->
    <div class="battle-right">
        <div class="gauss-card" onclick="toggleGaussSkill()">
            <div style="font-weight: bold; color: #9ec5ff; font-size: 14px;">雷鳴精算師 · 高斯</div>
            <div style="color: #ffd700; font-size: 10px;">⭐⭐⭐⭐⭐</div>
            <div class="gauss-avatar-box">⚡</div>
            <div style="font-size: 11px; color: #aaa;">天賦：常態精算領域</div>
            <button class="skill-btn">啟動高斯奧秘</button>
        </div>

        <div class="tooltip-box" id="gaussTooltip">
            <strong>高斯的期望值教學：</strong>
            <p id="gaussHint">計算公式：期望值 E(X) = 每個結果的值 × 其發生的機率，然後將它們相加。</p>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ 請在此處填入你的 Supabase 連接資訊 ⚠️
    // ==========================================
    const SUPABASE_URL = 'https://hjscymfoluuqsltfshxu.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqc2N5bWZvbHV1cXNsdGZzaHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzQxNzcsImV4cCI6MjA5OTE1MDE3N30.AVaR1LWvnaONa5KIYr4rTteqZ-VgdPOvFgGvLw8f9Zk'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let studentId = localStorage.getItem('supabase_student_id') || null;

    let bossMaxHP = 300;
    let bossCurrentHP = 300;

    // 戰場關卡資料庫 (DSE 期望值核心考點)
    const battlePool = [
        {
            level: 'Level 1 ✦ 基礎期望值',
            desc: '混沌魔獸釋放了「虛無屏障」。你要指揮防禦核心開火，請計算【哪一個陣型能造成更高的平均（期望）傷害】，並輸入該【最高期望傷害值】：',
            alpha: { damage: 120, rate: 0.80, text: '80% 機率造成 120 點傷害，其餘機率 0 傷害' }, // EV = 96
            beta: { damage: 300, rate: 0.30, text: '30% 機率造成 300 點傷害，其餘機率 0 傷害' },  // EV = 90
            correctEV: 96, // 陣型 Alpha 期望值較高
            explanation: '陣型 Alpha 的期望傷害 = 120 × 0.8 = 96。\n陣型 Beta 的期望傷害 = 300 × 0.3 = 90。\n因此 Alpha 陣型較佳，最高期望值為 96 點。'
        },
        {
            level: 'Level 2 ✦ 雙重概率複合',
            desc: 'Boss 召喚了護衛。這次魔法陣會產生複合效果，請精算【最高期望傷害值】並輸入：',
            alpha: { damage: 200, rate: 0.50, text: '50% 機率造成 200 傷害，40% 機率造成 50 傷害，10% 造成 0' }, // EV = 100 + 20 = 120
            beta: { damage: 400, rate: 0.25, text: '25% 機率造成 400 傷害，50% 機率造成 30 傷害，25% 造成 0' },  // EV = 100 + 15 = 115
            correctEV: 120, // 陣型 Alpha 較高
            explanation: '陣型 Alpha 的期望傷害 = (200 × 0.5) + (50 × 0.4) + (0 × 0.1) = 100 + 20 = 120。\n陣型 Beta = (400 × 0.25) + (30 × 0.5) + (0 × 0.25) = 100 + 15 = 115。\n最高為 120。'
        },
        {
            level: 'Level 3 ✦ 負值決策 (DSE 常考)',
            desc: '警告！Boss 施放了「反物質力場」，有些魔法會反噬核心。請精算【哪一個陣型的平均損失最小（即期望傷害最高）】，並輸入該【最高期望值】（注意正負號）：',
            alpha: { damage: 150, rate: 0.70, text: '70% 造成 150 點傷害，但有 30% 機率對防線造成 -50 點反噬' }, // EV = 105 - 15 = 90
            beta: { damage: 200, rate: 0.60, text: '60% 造成 200 點傷害，但有 40% 機率對防線造成 -100 點反噬' }, // EV = 120 - 40 = 80
            correctEV: 90, 
            explanation: '陣型 Alpha = (150 × 0.7) + (-50 × 0.3) = 105 - 15 = 90。\n陣型 Beta = (200 × 0.6) + (-100 × 0.4) = 120 - 40 = 80。\n因此 Alpha 損失較小，最高期望值為 90。'
        }
    ];

    let currentBattle = null;

    // 初始化防禦戰
    function initBattle() {
        currentBattle = battlePool[Math.floor(Math.random() * battlePool.length)];
        
        document.getElementById('tacticLevel').innerText = currentBattle.level;
        document.getElementById('tacticText').innerText = currentBattle.desc;
        document.getElementById('spellAlphaDesc').innerText = currentBattle.alpha.text;
        document.getElementById('spellBetaDesc').innerText = currentBattle.beta.text;
        
        document.getElementById('evInput').value = '';
        document.getElementById('battleFeedback').innerText = '';
        document.getElementById('gaussTooltip').style.display = 'none';
        document.getElementById('gaussHint').innerHTML = `<strong>高斯的精算指導：</strong><br>${currentBattle.explanation}`;

        bossCurrentHP = bossMaxHP;
        updateHPBar();
    }

    // 更新血條 UI
    function updateHPBar() {
        const percentage = (bossCurrentHP / bossMaxHP) * 100;
        document.getElementById('hpFill').style.width = `${Math.max(0, percentage)}%`;
        
        if (bossCurrentHP <= 0) {
            document.getElementById('bossIcon').innerText = '💀';
            document.getElementById('bossName').innerText = '已消滅！';
        } else {
            document.getElementById('bossIcon').innerText = '👹';
            document.getElementById('bossName').innerText = '混沌獸 (HP: ' + bossCurrentHP + ')';
        }
    }

    // 切換高斯提示顯示
    function toggleGaussSkill() {
        const tooltip = document.getElementById('gaussTooltip');
        tooltip.style.display = tooltip.style.display === 'block' ? 'none' : 'block';
    }

    // 發動精算攻擊
    async function fireSpells() {
        const playerAns = parseFloat(document.getElementById('evInput').value);
        const feedback = document.getElementById('battleFeedback');

        if (isNaN(playerAns)) {
            feedback.innerText = '⚠️ 請輸入最優陣型的期望傷害！';
            feedback.style.color = '#ff4d4d';
            return;
        }

        if (playerAns === currentBattle.correctEV) {
            // 答對：Boss 遭受雷擊，血量扣除 150 點
            bossCurrentHP -= 150;
            feedback.innerText = '⚡【期望值精算正確！】高斯發動雷擊，對 Boss 造成 150 點暴擊傷害！';
            feedback.style.color = '#00ffcc';
            updateHPBar();

            // 特效：讓 Boss 抖動
            const boss = document.getElementById('bossContainer');
            boss.style.transform = 'translateX(-20px)';
            setTimeout(() => { boss.style.transform = 'translateX(20px)'; }, 100);
            setTimeout(() => { boss.style.transform = 'translateX(0)'; }, 200);

            if (bossCurrentHP <= 0) {
                feedback.innerText = '🎉【大捷！】混沌魔獸已被消滅，概率之塔防守成功！獲得 100 寶石！';
                await updateProgressOnCloud(true);
            }
        } else {
            // 答錯：Boss 反擊，無傷害
            feedback.innerText = '❌【計算失誤！】魔法陣能量消散。Boss 咆哮並發動反擊！請仔細校對高斯提示。';
            feedback.style.color = '#ff4d4d';
            await updateProgressOnCloud(false);
        }
    }

    /**
     * 雲端存檔更新 (將答題記錄寫入 Expected_Value 模組)
     */
    async function updateProgressOnCloud(isCorrect) {
        if (!studentId) {
            console.warn('⚠️ 未登入，尋找預設測試學號...');
            const { data } = await supabaseClient.from('students').select('id').limit(1);
            if (data && data.length > 0) {
                studentId = data[0].id;
            } else {
                return;
            }
        }

        try {
            // 1. 擊敗 Boss 贈送寶石
            if (isCorrect && bossCurrentHP <= 0) {
                const { data: progress } = await supabaseClient
                    .from('student_progress')
                    .select('gems')
                    .eq('student_id', studentId)
                    .single();
                
                if (progress) {
                    await supabaseClient
                        .from('student_progress')
                        .update({ gems: progress.gems + 100 })
                        .eq('student_id', studentId);
                }
            }

            // 2. 更新 dse_records 的 Expected_Value 成績
            const { data: record } = await supabaseClient
                .from('dse_records')
                .select('*')
                .eq('student_id', studentId)
                .eq('topic', 'Expected_Value')
                .single();

            if (record) {
                await supabaseClient
                    .from('dse_records')
                    .update({
                        total_attempts: record.total_attempts + 1,
                        correct_attempts: record.correct_attempts + (isCorrect ? 1 : 0)
                    })
                    .eq('id', record.id);
            } else {
                await supabaseClient
                    .from('dse_records')
                    .insert([{
                        student_id: studentId,
                        topic: 'Expected_Value',
                        total_attempts: 1,
                        correct_attempts: isCorrect ? 1 : 0
                    }]);
            }
            console.log('☁️ 雲端防禦戰數據同步成功！');
        } catch (e) {
            console.error('❌ 雲端同步失敗：', e);
        }
    }

    // 運行
    initBattle();
</script>
</body>
</html>
