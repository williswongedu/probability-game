<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數源對決 - 線上對戰殿堂</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --stadium-bg: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=1600&auto=format&fit=crop');
        }

        body {
            background: #04020a;
            color: #d1dbff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        .battle-stadium-bg {
            position: absolute;
            top: -5%; left: -5%;
            width: 110%; height: 110%;
            background: var(--stadium-bg) center/cover no-repeat;
            opacity: 0.15;
            filter: blur(5px);
            z-index: 1;
            pointer-events: none;
        }

        .battle-arena-layout {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
            z-index: 10;
        }

        .combat-table {
            flex: 1.4;
            min-width: 350px;
            background: rgba(8, 12, 38, 0.95);
            border: 3px solid #00ffcc;
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        .duel-board-ptcg {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 2px solid #233470;
            border-radius: 16px;
            background: rgba(0,0,0,0.5);
            padding: 20px;
            position: relative;
            perspective: 1000px;
        }

        .battle-zone-segment {
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-height: 150px;
            background: linear-gradient(170deg, rgba(255,255,255,0.01) 0%, rgba(255,255,255,0.04) 100%);
            border-radius: 12px;
            padding: 10px;
            transform: rotateX(15deg);
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .active-slot-ptcg {
            width: 110px;
            height: 150px;
            border: 2.5px solid #e0c068;
            border-radius: 10px;
            background: linear-gradient(135deg, #1b0e35 0%, #050212 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            font-size: 11px;
            padding: 8px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.7);
            transform: translateZ(30px);
            transform-style: preserve-3d;
            transition: all 0.3s;
        }

        .bench-zone-ptcg {
            display: flex;
            gap: 10px;
            justify-content: center;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 10px;
            border: 1px dashed #233470;
            margin-top: 10px;
            transform: rotateX(10deg);
            transform-style: preserve-3d;
        }

        .bench-slot {
            width: 65px;
            height: 85px;
            border: 1.5px dashed rgba(255,255,255,0.3);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            background: rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.2s;
            color: #aaa;
            transform: translateZ(10px);
        }

        .bench-slot.filled {
            border-style: solid;
            border-color: #00bfff;
            background: #0f153a;
            color: #fff;
            font-weight: bold;
            box-shadow: 0 5px 10px rgba(0, 191, 255, 0.3);
        }

        .bench-slot:hover {
            transform: translateZ(20px) scale(1.08);
            border-color: #00ffcc;
        }

        .hp-segment {
            width: 100%;
            text-align: center;
            transform: translateZ(10px);
        }

        .hp-bar-tcg {
            width: 100%;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }

        .hp-bar-tcg-fill {
            width: 100%;
            height: 100%;
            background: #ff4d4d;
            transition: width 0.3s;
        }

        .quiz-panel-ptcg {
            background: rgba(0,0,0,0.65);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }

        .quiz-title {
            color: #00ffff;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .quiz-desc {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
            color: #e2d9f3;
        }

        .quiz-input-group {
            display: flex;
            gap: 10px;
        }

        .quiz-input-group input {
            flex: 1;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #5d4297;
            border-radius: 8px;
            color: #fff;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .btn-fire-ptcg {
            padding: 10px 24px;
            background: linear-gradient(135deg, #00ffcc 0%, #008b8b 100%);
            border: none;
            border-radius: 8px;
            color: #120524;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }

        .combat-sidebar {
            flex: 0.6;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-back {
            background: transparent;
            border: 2px solid #5d4297;
            color: #d1dbff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="battle-stadium-bg" id="parallaxStadium"></div>

<div style="display:flex; justify-content:space-between; width:100%; max-width:1100px; border-bottom:1px solid rgba(224,192,104,0.3); padding-bottom:8px; margin-bottom:15px; z-index:10;">
    <span style="font-weight:bold; color:#00ffcc; font-size:18px;">⚔️ 概率線上對戰殿堂</span>
    <span>💎 擁有寶石：<span id="gemCount">0</span></span>
</div>

<div class="battle-arena-layout">
    <div class="combat-table">
        <div class="duel-board-ptcg">
            <!-- 敵方半場 -->
            <div style="font-size:11px; color:#ff7a7a; font-weight:bold; text-align:center;">🔴 敵方半場 (OPPONENT SEGMENT)</div>
            <div class="battle-zone-segment">
                <div class="active-slot-ptcg" id="enemyActive">
                    <div style="font-weight:bold; color:#ff7a7a;">混沌獸 EX</div>
                    <div style="font-size:40px; transform: translateZ(15px);">👿</div>
                    <div class="hp-segment">
                        HP: <span id="enemyActiveHP">300</span>/300
                        <div class="hp-bar-tcg"><div class="hp-bar-tcg-fill" id="enemyActiveHPFill"></div></div>
                    </div>
                </div>
            </div>
            
            <hr style="border:0; border-top:1px dashed #233470; margin:10px 0;">

            <!-- 我方半場 -->
            <div style="font-size:11px; color:#00ffcc; font-weight:bold; text-align:center;">🟢 我方半場 (PLAYER SEGMENT)</div>
            <div class="battle-zone-segment">
                <div class="active-slot-ptcg" id="playerActive">
                    <div style="font-weight:bold; color:#00ffff;" id="playerActiveName">主戰位</div>
                    <div style="font-size:40px; transform: translateZ(15px);" id="playerActiveEmoji">❔</div>
                    <div class="hp-segment" id="playerActiveHPBox" style="display:none;">
                        HP: <span id="playerActiveHP">120</span>/120
                        <div class="hp-bar-tcg"><div class="hp-bar-tcg-fill" id="playerActiveHPFill"></div></div>
                    </div>
                    <div id="playerActiveSkill" style="font-size:9px; color:#ccc;">請從下方備戰區派遣英靈出戰</div>
                </div>
            </div>

            <!-- 我方備戰區 -->
            <div class="bench-zone-ptcg" id="playerBench"></div>
        </div>

        <div class="quiz-panel-ptcg">
            <div class="quiz-title">✨ 發動公式必殺連擊</div>
            <div class="quiz-desc" id="quizDesc">請先從備戰區點擊派遣一位英靈上陣，以啟動城堡決鬥！</div>
            <div class="quiz-input-group">
                <input type="number" step="0.1" id="quizInput" placeholder="輸入期望傷害或概率值">
                <button class="btn-fire-ptcg" onclick="submitDuelAction()">發動必殺</button>
            </div>
            <div id="duelFeedback" style="margin-top:10px; font-weight:bold; text-align:center; min-height:20px;"></div>
        </div>
    </div>

    <div class="combat-sidebar">
        <div style="background:rgba(0,0,0,0.6); border:2px solid #e0c068; border-radius:15px; padding:15px;">
            <h3 style="color:#ffd700; margin-top:0; font-size:15px;">📡 連線模式切換</h3>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <button class="btn-fire-ptcg" style="font-size:12px; padding:8px;" onclick="switchMode('AI')">🤖 城堡練習模式 (單人 AI)</button>
                <button class="btn-fire-ptcg" style="font-size:12px; padding:8px; background:linear-gradient(135deg, #7c4dff 0%, #3f1fa3 100%); border:1px solid #fff;" onclick="switchMode('ONLINE')">🌐 線上同好對決 (實時 Room)</button>
            </div>
            <div id="modeStatus" style="margin-top:10px; font-size:11px; color:#00ffcc; font-weight:bold; text-align:center;">目前模式：練習 AI 對戰</div>
        </div>

        <div style="background:rgba(0,0,0,0.5); border:2px solid #233470; border-radius:12px; padding:15px; font-size:12px; line-height:1.5;">
            <h4 style="margin-top:0; color:#ffd700;">DSE 對戰精算策略：</h4>
            1. <b>人物角色 (EX)</b>：打出 100 點主要傷害。<br>
            2. <b>神仙寵物 (Pet)</b>：防守敵方 30 點傷害。<br>
            3. <b>武器裝備 (Weapon)</b>：答對後附加 50 點額外暴擊。
        </div>

        <a href="lobby.html" class="btn-back">🏰 返回城堡大廳</a>
    </div>
</div>

<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; 

    let isLocalMode = (SUPABASE_URL === 'YOUR_SUPABASE_URL' || SUPABASE_URL === '');
    let supabaseClient = null;
    if (!isLocalMode) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const studentId = localStorage.getItem('supabase_student_id');
    const studentName = localStorage.getItem('supabase_student_name');
    let gems = 0;
    let unlockedCards = [];
    let currentDeck = [];
    let currentActiveIndex = -1; 
    let currentMode = 'AI'; 

    let enemyHP = 300;
    let currentQuizAns = 0;
    let currentTopic = '';

    const fullCardStats = {
        '雷鳴精算師 · 高斯': { name: '雷鳴精算師 · 高斯', emoji: '🧙‍♂️', hp: 120, skill: '常態修正', type: '人物角色' },
        '時空編織者 · 費馬': { name: '時空編織者 · 費馬', emoji: '🔮', hp: 130, skill: '概率路徑', type: '人物角色' },
        '幻影刺客 · 貝葉斯': { name: '幻影刺客 · 貝葉斯', emoji: '🗡️', hp: 120, skill: '條件神罰', type: '人物角色' },
        '阿基米德鴞': { name: '阿基米德鴞', emoji: '🦉', hp: 90, skill: '窮竭守護', type: '寵物' },
        '卡爾丹熊': { name: '卡爾丹熊', emoji: '🐻', hp: 100, skill: '大數幸運', type: '寵物' },
        '帕斯卡三叉戟': { name: '帕斯卡三叉戟', emoji: '🔱', hp: 80, skill: '三角聯攜', type: '武器卡' },
        '貝葉斯羅盤': { name: '貝葉斯羅盤', emoji: '🧭', hp: 80, skill: '條件羅盤', type: '武器卡' }
    };

    const parallaxStadium = document.getElementById('parallaxStadium');
    window.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 45;
        const y = (window.innerHeight / 2 - e.clientY) / 45;
        parallaxStadium.style.transform = `translate(${x}px, ${y}px) scale(1.05)`;
    });

    const duelQuizPool = [
        {
            type: 'Expected_Value',
            gen: () => {
                let dmg = Math.floor(Math.random() * 2) * 50 + 150;
                let probPercent = Math.floor(Math.random() * 3) * 10 + 50;
                let ans = dmg * (probPercent / 100);
                return {
                    text: `敵方釋放迷霧屏障。我方英靈發動期望值領域：有 ${probPercent}% 機率造成 ${dmg} 點傷害，其餘機率 0 傷害，請精算【期望傷害值】。`,
                    ans: parseFloat(ans.toFixed(1))
                };
            }
        },
        {
            type: 'Permutations_Combinations',
            gen: () => {
                let items = Math.floor(Math.random() * 3) + 5;
                let ans = factorial(items) / (factorial(3) * factorial(items - 3));
                return {
                    text: `城堡大陣需要部署防禦药水。從 ${items} 種不同的魔法元素中選出 3 種不同的配方，一共有多少種不同的【組合 C】？`,
                    ans: ans
                };
            }
        },
        {
            type: 'Conditional_Probability',
            gen: () => {
                let p = Math.floor(Math.random() * 2) * 10 + 70;
                let dec = p / 100;
                let ans = parseFloat((dec * dec * 100).toFixed(1));
                return {
                    text: `敵方已被標記。已知標記狀態下，你的必殺技單次暴擊概率高達 ${p}%。在此已知條件下，你連續【兩次必殺技都觸發暴擊】的概率是多少%？`,
                    ans: ans
                };
            }
        }
    ];

    async function initBattle() {
        if (!studentId) {
            alert('登入失效，請重新登入！');
            window.location.href = 'index.html';
            return;
        }

        if (isLocalMode) {
            let users = JSON.parse(localStorage.getItem('local_users') || '{}');
            let user = users[studentName];
            if (user) {
                gems = user.gems;
                currentDeck = user.current_deck || [];
            }
        } else {
            const { data } = await supabaseClient.from('student_progress').select('*').eq('student_id', studentId).single();
            if (data) {
                gems = data.gems;
                currentDeck = data.current_deck || [];
            }
        }

        document.getElementById('gemCount').innerText = gems;
        renderBench();
    }

    function renderBench() {
        const benchContainer = document.getElementById('playerBench');
        benchContainer.innerHTML = '';
        for (let i = 0; i < 5; i++) {
            const bench = document.createElement('div');
            if (i < currentDeck.length) {
                const cardName = currentDeck[i];
                const card = fullCardStats[cardName];
                bench.innerText = `${card.emoji}\\n${card.name.substring(0, 3)}`;
                bench.className = 'bench-slot filled';
                bench.onclick = () => deployToActive(i);
            } else {
                bench.innerText = '空';
                bench.className = 'bench-slot';
            }
            benchContainer.appendChild(bench);
        }
    }

    function deployToActive(index) {
        if (index >= currentDeck.length) return;
        currentActiveIndex = index;
        const cardName = currentDeck[index];
        const card = fullCardStats[cardName];

        document.getElementById('playerActiveName').innerText = card.name;
        document.getElementById('playerActiveEmoji').innerText = card.emoji;
        document.getElementById('playerActiveHPBox').style.display = 'block';
        document.getElementById('playerActiveHP').innerText = card.hp;
        document.getElementById('playerActiveHPFill').style.width = '100%';
        document.getElementById('playerActiveSkill').innerText = `必殺技：${card.skill} (${card.type})`;

        nextQuizRound();
    }

    function nextQuizRound() {
        const qTemplate = duelQuizPool[Math.floor(Math.random() * duelQuizPool.length)];
        const q = qTemplate.gen();
        currentQuizAns = q.ans;
        currentTopic = qTemplate.type;

        document.getElementById('quizDesc').innerText = q.text;
        document.getElementById('quizInput').value = '';
        document.getElementById('duelFeedback').innerText = '';
    }

    async function submitDuelAction() {
        if (currentActiveIndex === -1) {
            alert('請先派遣備戰區的英靈上場！');
            return;
        }

        const studentAns = parseFloat(document.getElementById('quizInput').value);
        const fb = document.getElementById('duelFeedback');

        if (isNaN(studentAns)) {
            fb.innerText = '⚠️ 請輸入你的答案！';
            fb.style.color = '#ff4d4d';
            return;
        }

        let isCorrect = Math.abs(studentAns - currentQuizAns) <= 0.2;

        if (isCorrect) {
            const cardName = currentDeck[currentActiveIndex];
            const card = fullCardStats[cardName];
            
            let dmg = 100;
            if (card.type === '寵物') { dmg = 60; }
            else if (card.type === '武器卡') { dmg = 80; }

            enemyHP -= dmg;
            if (enemyHP < 0) enemyHP = 0;

            fb.innerText = `⚡【回答正確！】發動必殺技 [${card.skill}]，對敵方造成 ${dmg} 點痛擊！`;
            fb.style.color = '#00ffcc';

            updateHPBars();

            if (enemyHP <= 0) {
                fb.innerText = '🏆【封印大捷！】敵方混沌獸已完全擊潰！恭喜獲得 150 寶石獎勵！';
                gems += 150;
                document.getElementById('gemCount').innerText = gems;

                if (isLocalMode) {
                    let users = JSON.parse(localStorage.getItem('local_users') || '{}');
                    if (users[studentName]) {
                        users[studentName].gems = gems;
                        localStorage.setItem('local_users', JSON.stringify(users));
                    }
                } else {
                    await supabaseClient.from('student_progress').update({ gems }).eq('student_id', studentId);
                }
            }
        } else {
            fb.innerText = `❌【公式反噬！】計算失誤。受到 40 反噬傷害！（正確答案是 ${currentQuizAns}）`;
            fb.style.color = '#ff4d4d';
        }

        await uploadDSERecord(isCorrect);
        setTimeout(nextQuizRound, 2500);
    }

    function updateHPBars() {
        document.getElementById('enemyActiveHP').innerText = enemyHP;
        document.getElementById('enemyActiveHPFill').style.width = `${(enemyHP/300)*100}%`;
    }

    async function uploadDSERecord(isCorrect) {
        if (isLocalMode) return;
        try {
            const { data: record } = await supabaseClient.from('dse_records').select('*').eq('student_id', studentId).eq('topic', currentTopic).single();
            if (record) {
                await supabaseClient.from('dse_records').update({
                    total_attempts: record.total_attempts + 1,
                    correct_attempts: record.correct_attempts + (isCorrect ? 1 : 0)
                }).eq('id', record.id);
            } else {
                await supabaseClient.from('dse_records').insert([{
                    student_id: studentId,
                    topic: currentTopic,
                    total_attempts: 1,
                    correct_attempts: isCorrect ? 1 : 0
                }]);
            }
        } catch (e) {
            console.error(e);
        }
    }

    function switchMode(mode) {
        currentMode = mode;
        const status = document.getElementById('modeStatus');
        if (mode === 'AI') {
            status.innerText = '目前模式：練習 AI 對戰';
        } else {
            status.innerText = '目前模式：線上同好對決 (實時 Room 連線中...)';
            alert('📡 Supabase Room 已建立！歡迎將網址分享給其他同學進行即時智力比拼！');
        }
    }

    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        return n * factorial(n - 1);
    }

    initBattle();
</script>
</body>
</html>
