<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數源對決 - TCG 皇家決鬥場</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --stadium-gradient: radial-gradient(circle at center, #1b2660 0%, #030514 100%);
            --holo-laser: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255, 215, 0, 0.25) 25%, rgba(0, 255, 255, 0.25) 50%, rgba(255, 0, 255, 0.2) 75%, rgba(255,255,255,0) 100%);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #030209;
            color: #d1dbff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 💡 還原直立式 Mobile-first 3D 戰道盤面容器 */
        .phone-container {
            width: 100vw;
            height: 100vh;
            max-width: 430px;
            max-height: 850px;
            background: var(--stadium-gradient);
            border: 4px solid #3a2f6b;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(93,66,151,0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            padding: 15px;
            perspective: 1200px; /* 提供極致 3D 空間景深 */
        }

        /* 頂端與底端狀態欄 */
        .navbar-status {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: bold;
            color: #ffd700;
            z-index: 10;
            background: rgba(10, 6, 24, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(224, 192, 104, 0.3);
        }

        /* 3D 傾斜橢圓戰場 (Tilted Arena) */
        .battlefield-3d {
            flex-grow: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transform-style: preserve-3d;
            transform: rotateX(20deg) translateZ(0); /* 完美還原 PTCGP 斜切桌面 */
            margin: 10px 0;
        }

        /* ==================== 敵方戰區 (Opponent) ==================== */
        .opponent-zone {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transform-style: preserve-3d;
        }

        /* 敵方備戰區 (Opponent Bench) */
        .opp-bench-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            transform: translateZ(10px);
        }

        .mini-bench-card {
            width: 50px;
            height: 70px;
            background: linear-gradient(135deg, #4c1a1a 0%, #1a0505 100%);
            border: 1.5px solid #ff4d4d;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            font-size: 8px;
            font-weight: bold;
            color: #ff9e9e;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            position: relative;
        }

        /* 敵方主戰位 (Opponent Active) */
        .opp-active-slot {
            width: 90px;
            height: 125px;
            background: linear-gradient(135deg, #1b0e35 0%, #050212 100%);
            border: 2px solid #ff3e3e;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(255, 62, 62, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            font-size: 10px;
            transform: translateZ(20px);
            position: relative;
        }

        /* ==================== 我方戰區 (Player) ==================== */
        .player-zone {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            transform-style: preserve-3d;
        }

        /* 我方主戰位 (Player Active) */
        .player-active-slot {
            width: 100px;
            height: 140px;
            background: linear-gradient(135deg, #1b0e35 0%, #050212 100%);
            border: 2.5px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 255, 204, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            font-size: 11px;
            transform: translateZ(30px); /* 3D 浮空高度 */
            position: relative;
            transform-style: preserve-3d;
        }

        /* 我方備戰區 (Player Bench Slots) */
        .player-bench-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            transform: translateZ(15px);
        }

        .player-bench-card {
            width: 55px;
            height: 75px;
            background: linear-gradient(135deg, #0e2b35 0%, #020b12 100%);
            border: 1.5px solid #00bfff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            font-size: 8px;
            font-weight: bold;
            color: #00ffff;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
            position: relative;
        }

        .player-bench-card:hover {
            transform: translateY(-5px) scale(1.05);
            border-color: #fff;
        }

        /* HP 條樣式 */
        .hp-badge {
            font-size: 8px;
            font-weight: bold;
            background: rgba(0,0,0,0.6);
            padding: 1px 4px;
            border-radius: 4px;
        }

        /* ==================== 💥 受擊金色光圈暴擊 (Hit Splash VFX) ==================== */
        .hit-splash-container {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) translateZ(60px); /* 3D 頂層爆發 */
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        .hit-circle-pulse {
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, transparent 70%);
            box-shadow: 0 0 35px #ffd700, inset 0 0 25px #ffd700;
            animation: hit-pulse-scale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .hit-damage-text {
            position: absolute;
            font-size: 46px;
            font-weight: 900;
            color: #fff;
            font-family: 'Arial Black', sans-serif;
            text-shadow: 0 0 15px #ffd700, 2px 2px 4px #000;
            animation: hit-text-bounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 10;
        }

        @keyframes hit-pulse-scale {
            0% { transform: scale(0.2); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes hit-text-bounce {
            0% { transform: scale(0.3); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1.0); }
        }

        /* ==================== ⚡ 右下角星源能量充能鈕 (Energy Bolt) ==================== */
        .energy-generator {
            position: absolute;
            bottom: 120px; right: 15px;
            width: 50px; height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffeb3b 30%, #f57f17 100%);
            border: 3px solid #fff;
            box-shadow: 0 0 20px #ffeb3b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 20;
            transition: transform 0.2s;
        }

        .energy-generator:hover { transform: scale(1.1); }

        /* ==================== 🃏 底部手牌區 ==================== */
        .hand-fanned-zone {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: 10px;
            z-index: 20;
        }

        .hand-card-tcg {
            width: 65px;
            height: 90px;
            border: 1.5px solid #e0c068;
            border-radius: 6px;
            background: linear-gradient(135deg, #130a2a 0%, #050211 100%);
            position: absolute;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            box-sizing: border-box;
            color: #fff;
            font-size: 8px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            transition: transform 0.2s, bottom 0.2s;
            transform-origin: bottom center;
        }

        /* 💡 限制定位 */
        .hand-card-tcg:nth-child(1) { transform: rotate(-15deg) translateX(-60px); }
        .hand-card-tcg:nth-child(2) { transform: rotate(-5deg) translateX(-20px); }
        .hand-card-tcg:nth-child(3) { transform: rotate(5deg) translateX(20px); }
        .hand-card-tcg:nth-child(4) { transform: rotate(15deg) translateX(60px); }

        .hand-card-tcg:hover {
            transform: scale(1.25) translateY(-20px) rotate(0deg);
            z-index: 50;
            border-color: #00ffcc;
            box-shadow: 0 10px 25px rgba(0,255,204,0.5);
        }

        /* ==================== 🔬 答題與充能面板 ==================== */
        .control-quiz-overlay {
            background: rgba(8, 6, 26, 0.95);
            border: 2px solid #00ffcc;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 0 20px rgba(0,255,204,0.3);
            margin-top: 10px;
            z-index: 30;
        }

        .quiz-title {
            color: #00ffff;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .quiz-body {
            font-size: 13px;
            line-height: 1.4;
            color: #e2d9f3;
            margin-bottom: 8px;
        }

        .quiz-input-row {
            display: flex;
            gap: 8px;
        }

        .quiz-input-row input {
            flex: 1;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #5d4297;
            border-radius: 6px;
            color: #fff;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
        }

        .btn-launch-ptcg {
            padding: 8px 16px;
            background: linear-gradient(135deg, #00ffcc 0%, #008b8b 100%);
            border: none;
            border-radius: 6px;
            color: #120524;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <!-- 頂部狀態欄 -->
    <div class="navbar-status">
        <span>⚔️ 概率 TCG 決鬥場</span>
        <span>💎 寶石：<span id="gemCount">0</span></span>
    </div>

    <!-- 3D 戰場盤面 -->
    <div class="battlefield-3d">
        <!-- 🔴 敵方半場 (Opponent Field) -->
        <div class="opponent-zone">
            <!-- 敵方後排 (Bench) -->
            <div class="opp-bench-row">
                <div class="mini-bench-card" id="oppBench0">
                    <span>🦉 鴞</span>
                    <span class="hp-badge">HP: <span id="oppBenchHP0">50</span></span>
                    <!-- 受擊閃光 -->
                    <div class="hit-splash-container" id="oppBenchSplat0">
                        <div class="hit-circle-pulse"></div>
                        <div class="hit-damage-text">50</div>
                    </div>
                </div>
                <div class="mini-bench-card" id="oppBench1">
                    <span>🐻 熊</span>
                    <span class="hp-badge">HP: <span id="oppBenchHP1">50</span></span>
                    <div class="hit-splash-container" id="oppBenchSplat1">
                        <div class="hit-circle-pulse"></div>
                        <div class="hit-damage-text">50</div>
                    </div>
                </div>
            </div>

            <!-- 敵方前排主力 (Active) -->
            <div class="opp-active-slot" id="oppActive">
                <div style="font-weight:bold; color:#ff4d4d;">混沌獸 EX</div>
                <div style="font-size:32px;">👿</div>
                <span class="hp-badge">HP: <span id="oppActiveHP">110</span>/300</span>
                
                <!-- 敵方主力爆血 110 -->
                <div class="hit-splash-container" id="oppActiveSplat">
                    <div class="hit-circle-pulse"></div>
                    <div class="hit-damage-text">110</div>
                </div>
            </div>
        </div>

        <!-- ⚡ 右側星源能量球 -->
        <div class="energy-generator" onclick="triggerEnergyCharge()">⚡</div>

        <!-- 🟢 我方半場 (Player Field) -->
        <div class="player-zone">
            <!-- 我方前排主力 (Active) -->
            <div class="player-active-slot" id="playerActive">
                <div style="font-weight:bold; color:#00ffcc;" id="playerActiveName">主戰英靈</div>
                <div style="font-size:36px;" id="playerActiveEmoji">❔</div>
                <span class="hp-badge" id="playerActiveHPBox" style="display:none;">HP: <span id="playerActiveHP">120</span>/120</span>
                <span style="font-size:8px; color:#ccc;" id="playerActiveSkill">請從後備派遣出戰</span>
            </div>

            <!-- 我方後排備戰 (Bench) -->
            <div class="player-bench-row" id="playerBench"></div>
        </div>
    </div>

    <!-- 🃏 底部手牌區 -->
    <div class="hand-fanned-zone" id="playerHand">
        <div class="hand-card-tcg" onclick="playHand(0)">
            <span>人物 EX</span>
            <span style="font-size:16px;">🧙‍♂️</span>
            <span>高斯 EX</span>
        </div>
        <div class="hand-card-tcg" onclick="playHand(1)">
            <span>神獸 Pet</span>
            <span style="font-size:16px;">🦉</span>
            <span>阿基米德鴞</span>
        </div>
        <div class="hand-card-tcg" onclick="playHand(2)">
            <span>加成卡</span>
            <span style="font-size:16px;">🔱</span>
            <span>三叉戟</span>
        </div>
        <div class="hand-card-tcg" onclick="playHand(3)">
            <span>人物 EX</span>
            <span style="font-size:16px;">🔮</span>
            <span>費馬 EX</span>
        </div>
    </div>

    <!-- 🔬 答題充能控制台 -->
    <div class="control-quiz-overlay">
        <div class="quiz-title" id="quizTitle">★ 點擊右下角 [⚡] 進行星源充能</div>
        <div class="quiz-body" id="quizBody">派遣你手牌或後備區 of your deck to the active slot to start!</div>
        <div class="quiz-input-row">
            <input type="number" step="0.1" id="quizInput" placeholder="輸入算術數值">
            <button class="btn-launch-ptcg" onclick="submitQuizAction()">發動必殺</button>
        </div>
        <div id="duelFeedback" style="margin-top:6px; font-size:10px; font-weight:bold; text-align:center; min-height:14px;"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://hjscymfoluuqsltfshxu.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhqc2N5bWZvbHV1cXNsdGZzaHh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NzQxNzcsImV4cCI6MjA5OTE1MDE3N30.AVaR1LWvnaONa5KIYr4rTteqZ-VgdPOvFgGvLw8f9Zk'; 

    let isLocalMode = (SUPABASE_URL === 'YOUR_SUPABASE_URL' || SUPABASE_URL === '');
    let supabaseClient = null;
    if (!isLocalMode) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const studentId = localStorage.getItem('supabase_student_id');
    const studentName = localStorage.getItem('supabase_student_name');
    let gems = 0;
    let unlockedCards = [];
    let currentDeck = [];
    let currentActiveIndex = -1;

    let oppActiveHP = 110;
    let oppBenchHP0 = 50;
    let oppBenchHP1 = 50;

    let currentQuizAns = 0;
    let currentTopic = '';
    let actionType = ''; // 'ATTACK' or 'CHARGE'

    const fullCardStats = {
        '雷鳴精算師 · 高斯': { name: '雷鳴精算師 · 高斯', emoji: '🧙‍♂️', hp: 120, skill: '常態修正', type: '人物角色' },
        '時空編織者 · 費馬': { name: '時空編織者 · 費馬', emoji: '🔮', hp: 130, skill: '概率路徑', type: '人物角色' },
        '幻影刺客 · 貝葉斯': { name: '幻影刺客 · 貝葉斯', emoji: '🗡️', hp: 120, skill: '條件神罰', type: '人物角色' },
        '阿基米德鴞': { name: '阿基米德鴞', emoji: '🦉', hp: 90, skill: '窮竭守護', type: '寵物' },
        '卡爾丹熊': { name: '卡爾丹熊', emoji: '🐻', hp: 100, skill: '大數幸運', type: '寵物' },
        '帕斯卡三叉戟': { name: '帕斯卡三叉戟', emoji: '🔱', hp: 80, skill: '三角聯攜', type: '武器卡' },
        '貝葉斯羅盤': { name: '貝葉斯羅盤', emoji: '🧭', hp: 80, skill: '條件羅盤', type: '武器卡' }
    };

    const duelQuizPool = [
        {
            type: 'Expected_Value',
            gen: () => {
                let dmg = Math.floor(Math.random() * 2) * 50 + 150;
                let p = Math.floor(Math.random() * 3) * 10 + 50;
                return {
                    text: `計算高斯 EX 技能期望傷害：若發動有 ${p}% 機率造成 ${dmg} 點傷害，其餘機率 0。其【期望傷害值】為多少？`,
                    ans: dmg * (p / 100)
                };
            }
        },
        {
            type: 'Conditional_Probability',
            gen: () => {
                let p = Math.floor(Math.random() * 2) * 10 + 70;
                let dec = p / 100;
                return {
                    text: `已知敵方被標記，貝葉斯 EX 單次暴擊率提升至 ${p}%。在此條件下，你連續【兩次必殺技都暴擊】的概率是多少%？(保留1位小數)`,
                    ans: parseFloat((dec * dec * 100).toFixed(1))
                };
            }
        }
    ];

    async function initBattle() {
        if (!studentId) {
            alert('請先登入！');
            window.location.href = 'index.html';
            return;
        }

        if (isLocalMode) {
            let users = JSON.parse(localStorage.getItem('local_users') || '{}');
            let user = users[studentName];
            if (user) {
                gems = user.gems;
                currentDeck = user.current_deck || [];
            }
        } else {
            const { data } = await supabaseClient.from('student_progress').select('*').eq('student_id', studentId).single();
            if (data) {
                gems = data.gems;
                currentDeck = data.current_deck || [];
            }
        }

        document.getElementById('gemCount').innerText = gems;
        renderBench();
    }

    function renderBench() {
        const benchContainer = document.getElementById('playerBench');
        benchContainer.innerHTML = '';
        for (let i = 0; i < currentDeck.length; i++) {
            const cardName = currentDeck[i];
            const card = fullCardStats[cardName];
            if (!card) continue;

            const bCard = document.createElement('div');
            bCard.className = 'player-bench-card';
            bCard.innerHTML = `
                <span>${card.emoji}</span>
                <span class="hp-badge">HP: ${card.hp}</span>
            `;
            bCard.onclick = () => deployToActive(i);
            benchContainer.appendChild(bCard);
        }
    }

    function deployToActive(index) {
        currentActiveIndex = index;
        const cardName = currentDeck[index];
        const card = fullCardStats[cardName];

        document.getElementById('playerActiveName').innerText = card.name;
        document.getElementById('playerActiveEmoji').innerText = card.emoji;
        document.getElementById('playerActiveHPBox').style.display = 'block';
        document.getElementById('playerActiveHP').innerText = card.hp;
        document.getElementById('playerActiveSkill').innerText = `必殺技：${card.skill} (${card.type})`;

        nextQuizRound();
    }

    function triggerEnergyCharge() {
        actionType = 'CHARGE';
        document.getElementById('quizTitle').innerText = '⚡ 星源充能：口算爆速 Gate';
        
        let p = Math.floor(Math.random() * 2) * 10 + 40; 
        let dec = p / 100;
        currentQuizAns = parseFloat((dec * 2 * 100).toFixed(0)); 
        
        document.getElementById('quizBody').innerText = `「擲一魔法硬幣，單次正面率為 ${p}%。連續拋擲兩次，【至少有一次正面】的概率是多少%？」(口算整數)`;
        document.getElementById('quizInput').value = '';
    }

    function nextQuizRound() {
        actionType = 'ATTACK';
        const qTemplate = duelQuizPool[Math.floor(Math.random() * duelQuizPool.length)];
        const q = qTemplate.gen();
        currentQuizAns = q.ans;
        currentTopic = qTemplate.type;

        document.getElementById('quizTitle').innerText = '🔥 發動 DSE 必殺連擊';
        document.getElementById('quizBody').innerText = q.text;
        document.getElementById('quizInput').value = '';
    }

    async function submitQuizAction() {
        const val = parseFloat(document.getElementById('quizInput').value);
        const fb = document.getElementById('duelFeedback');
        if (isNaN(val)) { fb.innerText = '⚠️ 請輸入解！'; return; }

        let isCorrect = Math.abs(val - currentQuizAns) <= 0.2;

        if (isCorrect) {
            if (actionType === 'CHARGE') {
                fb.innerText = '⚡【充能成功！】星源附著成功，主戰英靈攻擊力增加 20 點！';
                fb.style.color = '#00ffcc';
                setTimeout(nextQuizRound, 2000);
            } else {
                triggerCombatSplashes();
            }
        } else {
            fb.innerText = `❌ 計算錯誤！受到城堡大陣反噬 40 傷害！（正確答案是 ${currentQuizAns}）`;
            fb.style.color = '#ff4d4d';
        }
    }

    function triggerCombatSplashes() {
        const splatActive = document.getElementById('oppActiveSplat');
        splatActive.style.display = 'flex';
        oppActiveHP -= 110;
        if (oppActiveHP < 0) oppActiveHP = 0;
        document.getElementById('oppActiveHP').innerText = oppActiveHP;

        const splatBench0 = document.getElementById('oppBenchSplat0');
        const splatBench1 = document.getElementById('oppBenchSplat1');
        splatBench0.style.display = 'flex';
        splatBench1.style.display = 'flex';

        oppBenchHP0 -= 50; if (oppBenchHP0 < 0) oppBenchHP0 = 0;
        oppBenchHP1 -= 50; if (oppBenchHP1 < 0) oppBenchHP1 = 0;

        document.getElementById('oppBenchHP0').innerText = oppBenchHP0;
        document.getElementById('oppBenchHP1').innerText = oppBenchHP1;

        setTimeout(() => {
            splatActive.style.display = 'none';
            splatBench0.style.display = 'none';
            splatBench1.style.display = 'none';
            
            if (oppActiveHP <= 0 && oppBenchHP0 <= 0 && oppBenchHP1 <= 0) {
                triggerWin();
            } else {
                nextQuizRound();
            }
        }, 2500);
    }

    async function triggerWin() {
        alert('🎉【榮耀大捷！】你成功擊潰了混沌獸及其所有後備部隊！獲得 150 寶石！');
        gems += 150;
        document.getElementById('gemCount').innerText = gems;

        if (isLocalMode) {
            let users = JSON.parse(localStorage.getItem('local_users') || '{}');
            if (users[studentName]) {
                users[studentName].gems = gems;
                localStorage.setItem('local_users', JSON.stringify(users));
            }
        } else {
            await supabaseClient.from('student_progress').update({ gems }).eq('student_id', studentId);
        }
        localStorage.setItem('cached_gems', gems);
        window.location.href = 'lobby.html';
    }

    initBattle();
</script>
</body>
</html>
