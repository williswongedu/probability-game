<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數源對決 - 卡牌背包與圖鑑</title>
    <!-- 引入 Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #180d35 0%, #060212 100%);
            color: #d1dbff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }

        h1 {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            margin: 10px 0;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            box-sizing: border-box;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(224,192,104,0.3);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 2px solid #5d4297;
            border-radius: 20px;
            color: #d1dbff;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, #e0c068 0%, #aa8210 100%);
            color: #120524;
            border-color: #fff;
            box-shadow: 0 0 15px rgba(224, 192, 104, 0.4);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .album-card {
            background: rgba(18, 9, 34, 0.85);
            border: 2px solid #5d4297;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            filter: grayscale(100%);
            opacity: 0.5;
        }

        .album-card.unlocked {
            filter: grayscale(0%);
            opacity: 1;
            border-color: #e0c068;
        }

        .album-card.unlocked:hover {
            transform: translateY(-8px);
            box-shadow: 0 5px 15px rgba(224, 192, 104, 0.3);
        }

        .album-card.selected-for-deck {
            border-color: #00ffff;
            box-shadow: 0 0 15px #00ffff;
        }

        .album-card-emoji {
            font-size: 40px;
            margin: 10px 0;
        }

        .album-card.card-character { border-color: #ffd700; }
        .album-card.card-pet { border-color: #00bfff; }
        .album-card.card-weapon { border-color: #ff3e3e; }

        .deck-builder-panel {
            background: rgba(12, 6, 28, 0.9);
            border: 3px solid #e0c068;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }

        .deck-slots {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 15px 0;
            min-height: 100px;
        }

        .slot {
            width: 90px;
            height: 120px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            color: #aaa;
            background: rgba(0,0,0,0.3);
        }

        .slot.filled {
            border-style: solid;
            border-color: #ffd700;
            color: #fff;
            background: linear-gradient(135deg, #1b0e35 0%, #050212 100%);
            font-weight: bold;
        }

        .btn-save-deck {
            background: linear-gradient(135deg, #00ffcc 0%, #008b8b 100%);
            color: #120524;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        .btn-back {
            background: transparent;
            border: 2px solid #5d4297;
            color: #d1dbff;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <span style="font-weight:bold; color:#ffd700; font-size:18px;">📖 城堡收藏冊與自建牌組</span>
        <span>💎 擁有寶石：<span id="gemCount">0</span></span>
    </div>

    <!-- 牌組構築面板 -->
    <div class="deck-builder-panel">
        <h3 style="color:#ffd700; margin:0;">🃏 我的出戰牌組 (限選 5 張卡牌)</h3>
        <p style="font-size:12px; color:#aaa; margin:5px 0 0 0;">請在下方解鎖的卡牌中點擊，挑選 5 張加入你的出戰卡組！</p>
        <div class="deck-slots" id="deckSlots">
            <div class="slot" id="slot0">空位 1</div>
            <div class="slot" id="slot1">空位 2</div>
            <div class="slot" id="slot2">空位 3</div>
            <div class="slot" id="slot3">空位 4</div>
            <div class="slot" id="slot4">空位 5</div>
        </div>
        <button class="btn-save-deck" onclick="saveDeckToCloud()">🔮 儲存自建牌組</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="filterType('all')">全部卡牌</button>
        <button class="tab-btn" onclick="filterType('人物角色')">人物角色</button>
        <button class="tab-btn" onclick="filterType('寵物')">神仙寵物</button>
        <button class="tab-btn" onclick="filterType('武器卡')">武器裝備</button>
    </div>

    <div class="grid-layout" id="dexGrid"></div>

    <a href="lobby.html" class="btn-back">🏰 返回城堡大廳</a>
</div>

<script>
    const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; 

    let isLocalMode = (SUPABASE_URL === 'YOUR_SUPABASE_URL' || SUPABASE_URL === '');
    let supabaseClient = null;
    if (!isLocalMode) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    const studentId = localStorage.getItem('supabase_student_id');
    const studentName = localStorage.getItem('supabase_student_name');
    let unlockedCards = [];
    let selectedDeck = [];
    let gems = 0;

    const fullCardDatabase = [
        { name: '雷鳴精算師 · 高斯', type: '人物角色', emoji: '🧙‍♂️', styleClass: 'card-character' },
        { name: '時空編織者 · 費馬', type: '人物角色', emoji: '🔮', styleClass: 'card-character' },
        { name: '幻影刺客 · 貝葉斯', type: '人物角色', emoji: '🗡️', styleClass: 'card-character' },
        { name: '阿基米德鴞', type: '寵物', emoji: '🦉', styleClass: 'card-pet' },
        { name: '卡爾丹熊', type: '寵物', emoji: '🐻', styleClass: 'card-pet' },
        { name: '帕斯卡三叉戟', type: '武器卡', emoji: '🔱', styleClass: 'card-weapon' },
        { name: '貝葉斯羅盤', type: '武器卡', emoji: '🧭', styleClass: 'card-weapon' }
    ];

    async function initDex() {
        if (!studentId) {
            alert('請先登入！');
            window.location.href = 'index.html';
            return;
        }

        if (isLocalMode) {
            let users = JSON.parse(localStorage.getItem('local_users') || '{}');
            let user = users[studentName];
            if (user) {
                gems = user.gems;
                unlockedCards = user.unlocked_cards || [];
                selectedDeck = user.current_deck || [];
            }
        } else {
            const { data } = await supabaseClient.from('student_progress').select('*').eq('student_id', studentId).single();
            if (data) {
                gems = data.gems;
                unlockedCards = data.unlocked_cards || [];
                selectedDeck = data.current_deck || [];
            }
        }

        document.getElementById('gemCount').innerText = gems;
        renderDex('all');
        updateDeckUI();
    }

    function renderDex(filter) {
        const grid = document.getElementById('dexGrid');
        grid.innerHTML = '';

        fullCardDatabase.forEach(card => {
            if (filter !== 'all' && card.type !== filter) return;

            const isUnlocked = unlockedCards.includes(card.name);
            const isSelected = selectedDeck.includes(card.name);

            const cardEl = document.createElement('div');
            cardEl.className = `album-card ${card.styleClass} ${isUnlocked ? 'unlocked' : ''} ${isSelected ? 'selected-for-deck' : ''}`;
            cardEl.innerHTML = `
                <div style="font-size:11px; font-weight:bold;">${card.type}</div>
                <div class="album-card-emoji">${card.emoji}</div>
                <div style="font-size:13px; font-weight:bold;">${card.name}</div>
                <div style="font-size:11px; color:#aaa; margin-top:5px;">${isUnlocked ? '🔓 已擁有' : '🔒 鎖定中'}</div>
            `;

            if (isUnlocked) {
                cardEl.onclick = () => toggleCardInDeck(card.name);
            }

            grid.appendChild(cardEl);
        });
    }

    function toggleCardInDeck(cardName) {
        const index = selectedDeck.indexOf(cardName);
        if (index > -1) {
            selectedDeck.splice(index, 1);
        } else {
            if (selectedDeck.length >= 5) {
                alert('出戰牌組上限為 5 張卡牌！');
                return;
            }
            selectedDeck.push(cardName);
        }

        updateDeckUI();
        renderDex('all');
    }

    function updateDeckUI() {
        for (let i = 0; i < 5; i++) {
            const slot = document.getElementById(`slot${i}`);
            if (i < selectedDeck.length) {
                const card = fullCardDatabase.find(c => c.name === selectedDeck[i]);
                slot.innerText = `${card.emoji} ${card.name}`;
                slot.className = 'slot filled';
            } else {
                slot.innerText = `空位 ${i+1}`;
                slot.className = 'slot';
            }
        }
    }

    async function saveDeckToCloud() {
        if (selectedDeck.length < 3) {
            alert('為了保證戰鬥流暢，請至少挑選 3 張卡牌！');
            return;
        }

        if (isLocalMode) {
            let users = JSON.parse(localStorage.getItem('local_users') || '{}');
            if (users[studentName]) {
                users[studentName].current_deck = selectedDeck;
                localStorage.setItem('local_users', JSON.stringify(users));
                alert('🎉 [本地測試模式] 出戰牌組儲存成功！');
            }
        } else {
            try {
                const { error } = await supabaseClient
                    .from('student_progress')
                    .update({ current_deck: selectedDeck })
                    .eq('student_id', studentId);

                if (error) throw error;
                alert('🎉 出戰牌組儲存成功！已實時同步至雲端戰卡系統！');
            } catch (e) {
                alert(`❌ 儲存失敗: ${e.message}`);
            }
        }
    }

    function filterType(type) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        renderDex(type);
    }

    initDex();
</script>
</body>
</html>
