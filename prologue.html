<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數源對決 - 星導城堡前傳</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0f0a21 0%, #030209 100%);
            overflow: hidden;
            font-family: 'Georgia', 'Microsoft JhengHei', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 星空背景 */
        .stars {
            position: absolute;
            width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?q=80&w=1200') center/cover;
            opacity: 0.3;
            animation: pulse-stars 10s infinite alternate;
        }

        @keyframes pulse-stars {
            0% { opacity: 0.2; transform: scale(1); }
            100% { opacity: 0.4; transform: scale(1.05); }
        }

        /* 漂浮的夢幻城堡 */
        .castle-silhouette {
            font-size: 150px;
            position: absolute;
            bottom: 30%;
            filter: drop-shadow(0 0 20px rgba(157, 142, 255, 0.4));
            animation: float-castle 4s ease-in-out infinite;
            z-index: 2;
        }

        @keyframes float-castle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* 古老卷軸容器 */
        .scroll-container {
            width: 80%;
            max-width: 600px;
            background: rgba(18, 9, 34, 0.85);
            border: 3px double #e0c068; /* 玫瑰金雕花邊框 */
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(224, 192, 104, 0.2);
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s ease;
        }

        .scroll-active {
            opacity: 1;
            transform: translateY(0);
        }

        /* 故事文本打字機效果 */
        .story-text {
            font-size: 18px;
            line-height: 1.8;
            color: #f6e6be;
            text-shadow: 0 0 8px rgba(246, 230, 190, 0.3);
            min-height: 150px;
            text-align: justify;
            margin-bottom: 25px;
        }

        .btn-start {
            background: linear-gradient(135deg, #e0c068 0%, #aa8210 100%);
            color: #120524;
            border: none;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(224, 192, 104, 0.4);
            opacity: 0;
            transition: opacity 1s ease;
        }

        /* 轉場白光閃爍 */
        .flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 1.5s ease;
        }
    </style>
</head>
<body>

<div class="stars"></div>
<div class="castle-silhouette">🏰</div>

<div class="scroll-container" id="scrollBox">
    <div class="story-text" id="storyText"></div>
    <button class="btn-start" id="startBtn" onclick="triggerTransition()">開啟概率傳送門</button>
</div>

<div class="flash-overlay" id="flash"></div>

<script>
    const story = "當因果的齒輪發生偏差，混沌魔獸「負期望值」擊碎了星儀，概率的迷霧吞噬了城堡……\n\n唯一的救贖，是召喚沉睡在星導城堡深處的「數學英靈」。\n\n精算師啊，拿起你的公式，用理性重塑世界的秩序吧！";
    let index = 0;
    const storyTextEl = document.getElementById('storyText');

    // 啟動開場動畫
    window.onload = () => {
        setTimeout(() => {
            document.getElementById('scrollBox').classList.add('scroll-active');
            typeWriter();
        }, 1000);
    };

    // 打字機效果
    function typeWriter() {
        if (index < story.length) {
            storyTextEl.innerHTML += story.charAt(index) === '\n' ? '<br>' : story.charAt(index);
            index++;
            setTimeout(typeWriter, 45);
        } else {
            // 文字打完後，亮起按鈕
            const btn = document.getElementById('startBtn');
            btn.style.opacity = 1;
        }
    }

    // 閃光轉場跳轉至登入頁面
    function triggerTransition() {
        const flash = document.getElementById('flash');
        flash.style.opacity = 1;
        setTimeout(() => {
            window.location.href = 'index.html'; // 跳轉至登入註冊頁面
        }, 1500);
    }
</script>
</body>
</html>
